name: SonarQube
on:
  push:
    branches:
      - vg-ms-information
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    env:
      R2DBC_URL_INFORMATION: ${{ secrets.R2DBC_URL_INFORMATION }}
      R2DBC_USERNAME_INFORMATION: ${{ secrets.R2DBC_USERNAME_INFORMATION }}
      R2DBC_PASSWORD_INFORMATION: ${{ secrets.R2DBC_PASSWORD_INFORMATION }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build, test, coverage and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=AlexanderRamosSanchez_vg-ms-project \
            -Dsonar.organization=alexanderramossanchez \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverage.exclusions="**/DatabaseApplication.java,**/kafka/**,**/webclient/**,**/Family*.java"
